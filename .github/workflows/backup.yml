# Every Sunday, dumps both databases (schema public), checks each dump restores
# into a throwaway Postgres, encrypts it and commits it to a separate PRIVATE repo
# (this one is public, so artifacts here would be readable by anyone).
#
# One-time setup:
#   1. Create a private repo, e.g. LifeOS-backups (with a README so it has a main branch).
#   2. ssh-keygen -t ed25519 -f backup_key -N ""  → backup_key.pub as a deploy key
#      with write access on that repo; backup_key (private) as BACKUP_DEPLOY_KEY here.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_REPO          – owner/LifeOS-backups
#   BACKUP_DEPLOY_KEY    – the private SSH key from step 2
#   BACKUP_PASSPHRASE    – long random passphrase; keep a copy in a password manager,
#                          without it the backups can't be opened
#   OWN_DATABASE_URL     – your DIRECT_URL (session pooler, port 5432; runners have no IPv6)
#   CAT_DATABASE_URL     – the cat deployment's direct URL (optional, skipped when empty)
#
# Restore: gpg -d own/<date>.sql.gz.gpg | gunzip > restore.sql, then
# psql "<DIRECT_URL of an empty project>" -f restore.sql and npx tsx prisma/apply-checks.ts.
# Every week is kept; dumps are small. To prune, delete old files in the backup repo.
name: Backup

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04 # pinned: the PGDG apt repo can lag behind a new Ubuntu
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB: postgresql://postgres:postgres@localhost:5432
    steps:
      - name: Install pg_dump 17
        # Must be at least the server's version (Supabase runs 17).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Dump, test restore, encrypt
        env:
          OWN_URL: ${{ secrets.OWN_DATABASE_URL }}
          CAT_URL: ${{ secrets.CAT_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PASSPHRASE" ]; then echo "::error::BACKUP_PASSPHRASE is not set"; exit 1; fi
          date=$(date -u +%F)
          mkdir -p out
          for name in own cat; do
            url_var="${name^^}_URL"; url="${!url_var}"
            if [ -z "$url" ]; then echo "$name: not configured, skipped"; continue; fi
            # Every database (and a fresh Supabase project) already has schema public; creating it again fails the restore.
            pg_dump "$url" --schema=public --no-owner --no-privileges | sed '/^CREATE SCHEMA public;$/d' | gzip > "$name.sql.gz"
            # Restore into a fresh database; any error fails the run.
            psql -q "$TEST_DB/postgres" -c "CREATE DATABASE $name"
            gunzip -c "$name.sql.gz" | psql -q -v ON_ERROR_STOP=1 "$TEST_DB/$name" > /dev/null
            echo "$name: $(du -h "$name.sql.gz" | cut -f1) gzipped, restored rows:"
            psql -At "$TEST_DB/$name" -c 'SELECT format($$  Expense %s, StudyEntry %s, Reminder %s, RoutineLog %s$$,
              (SELECT count(*) FROM "Expense"), (SELECT count(*) FROM "StudyEntry"),
              (SELECT count(*) FROM "Reminder"), (SELECT count(*) FROM "RoutineLog"))'
            mkdir -p "out/$name"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "out/$name/$date.sql.gz.gpg" "$name.sql.gz"
          done
          if [ -z "$(ls out)" ]; then echo "::error::No database configured"; exit 1; fi

      - name: Check out the backup repo
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          path: backups

      - name: Commit and push
        run: |
          set -euo pipefail
          cp -r out/. backups/
          cd backups
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "backup $(date -u +%F)" || { echo "nothing new"; exit 0; }
          git push

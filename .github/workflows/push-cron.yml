# Every 15 minutes, asks each deployment to send the push notifications that are
# due (src/app/api/push/cron/route.ts). GitHub may run scheduled jobs late, most
# of all at the top of the hour, so this runs at :02/:17/:32/:47 instead; the
# windows in src/lib/push/schedule.ts allow for lateness.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   LIFEOS_URL, LIFEOS_CRON_SECRET  – your deployment (https://…, no trailing slash) and its CRON_SECRET
#   CAT_URL, CAT_CRON_SECRET        – the cat deployment (optional)
name: Push notifications

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Your deployment
        env:
          URL: ${{ secrets.LIFEOS_URL }}
          SECRET: ${{ secrets.LIFEOS_CRON_SECRET }}
        run: |
          if [ -z "$URL" ]; then echo "not configured, skipped"; exit 0; fi
          # No -L: a redirect (wrong URL, or the login page) is shown and fails the run.
          code=$(curl -sS -o body.txt -w "%{http_code} %{redirect_url}" -H "Authorization: Bearer $SECRET" "${URL%/}/api/push/cron")
          echo "HTTP $code"; cat body.txt; echo
          case "$code" in 200*) ;; 3*) echo "::error::Redirected. Use the site's own https address as the URL secret, without a path."; exit 1 ;; *) exit 1 ;; esac
      - name: Cat deployment
        # Runs even when the step above failed, so one site being down doesn't silence the other.
        if: ${{ !cancelled() }}
        env:
          URL: ${{ secrets.CAT_URL }}
          SECRET: ${{ secrets.CAT_CRON_SECRET }}
        run: |
          if [ -z "$URL" ]; then echo "not configured, skipped"; exit 0; fi
          # No -L: a redirect (wrong URL, or the login page) is shown and fails the run.
          code=$(curl -sS -o body.txt -w "%{http_code} %{redirect_url}" -H "Authorization: Bearer $SECRET" "${URL%/}/api/push/cron")
          echo "HTTP $code"; cat body.txt; echo
          case "$code" in 200*) ;; 3*) echo "::error::Redirected. Use the site's own https address as the URL secret, without a path."; exit 1 ;; *) exit 1 ;; esac
